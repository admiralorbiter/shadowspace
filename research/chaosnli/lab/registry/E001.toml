go_criteria = """
Directional result consistent across SNLI and MNLI, survives at least
three neighborhood scales (k) and two probability geometries, exceeds
the corresponding stratified-null interval (add-one p < 0.01 with 10,000 perms),
and human-normalized recovery R_m is reported relative to Q_HH not relative to 1.0.
"""

language_corrections = """
CORRECTIONS REQUIRED before citing as established findings:

1. Significance: Do NOT claim p < 0.001. With 10,000 perms, add-one p_min = 0.0001.
   Current 100-perm design supports only: Q_model > Q_null_mean.

2. Ranking: Do NOT claim invariant ordering. Report Kendall W and mean tau, and use
   tiered groupings for top models where differences < item-bootstrap interval.
   Likely tiers:
     Tier 1: ALBERT-xxLarge, RoBERTa-Large, BART-Large
     Tier 2: XLNet-Large
     Tier 3: RoBERTa-Base, XLNet-Base, BERT-Large
     Tier 4: BERT-Base
     Tier 5: DistilBERT

3. Human gap: Do NOT interpret delta_edge = 1 - Q_model as a performance gap.
   mean_human_edge_support = 1.0 is a normalization identity (each row has weight k,
   average S also has total row weight k). Replace with Q_HH cross-fitted reference.

4. Terminology: These are LATENT POSTERIOR draws (theta ~ Dirichlet(x+alpha)), not
   posterior-predictive draws (x_new ~ Multinomial(100, theta)).
"""
