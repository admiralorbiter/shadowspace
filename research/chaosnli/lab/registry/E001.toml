# Experiment E001: Posterior Edge-Support Graph
id = "E001"
title = "Posterior edge-support graph construction and model-human relational comparison"
status = "pilot_partial"

dataset_release = "chaosnli-canonical-2026-08-02"
partition = "lab_discovery_v1"

unit_of_analysis = "edge"
question = """
How does replacing empirical fuzzy neighborhood edges with latent posterior edge support
s_ij(k) = E[W_ij(k) | human vote counts] (averaged over Dirichlet latent posterior draws)
alter observed model-human relational alignment and model ranking?
"""

estimands = [
  "mean_jsd_bits",
