name: Education Audit CI

on:
  push:
    branches:
      - main
      - research/education-counterfactual-audit
    paths:
      - 'research/education_audit/**'
      - 'tests/education_audit/**'
      - 'docs/education_audit/**'
      - 'pyproject.toml'
      - '.github/workflows/pytest_education_audit.yml'
  pull_request:
    branches:
      - main
      - research/education-counterfactual-audit
    paths:
      - 'research/education_audit/**'
      - 'tests/education_audit/**'
      - 'docs/education_audit/**'
      - 'pyproject.toml'
      - '.github/workflows/pytest_education_audit.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy

      - name: Run Education Audit Tests
        run: |
          PYTHONPATH=. pytest --no-cov tests/education_audit
