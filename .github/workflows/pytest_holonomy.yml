name: Holonomy Test Suite CI

on:
  push:
    branches: [ main, research/ambiguity-holonomy ]
  pull_request:
    branches: [ main, research/ambiguity-holonomy ]

jobs:
  test-holonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy torch transformers

      - name: Run Holonomy Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest --no-cov tests/holonomy tests/holonomy_natural_language
