[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowspace"
version = "0.1.0"
description = "Epistemic reliability during interactive high-dimensional visualization."
requires-python = ">=3.12"
license = { text = "CC-BY-NC-4.0" }
dependencies = [
    "dtour==0.4.4",
    "polars>=1.38.1",
    "numpy>=2.2.0",
    "flask>=3.1.0",
    "pydantic>=2.0.0",
]

[project.scripts]
shadowspace = "shadowspace.cli:main"

[project.optional-dependencies]
datasets = [
    "scikit-learn>=1.4.0",
]
research = [
    "scipy>=1.12.0",
    "pyarrow>=15.0.0",
    "PyYAML>=6.0.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces flake8, isort, Black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["shadowspace"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=shadowspace --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/shadowspace"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
